<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Complete</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div><strong>Web Dev Training</strong></div>
        <nav>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <div class="page">
        <section class="card form-card" id="successCard">
            <h1>Login Status</h1>
            <div id="successMessage" class="status success"></div>
        </section>
    </div>

    <script>
        const messageBox = document.getElementById("successMessage");
        try {
            const listRaw = localStorage.getItem("registeredUsers");
            const list = listRaw ? JSON.parse(listRaw) : [];
            const currentEmail = localStorage.getItem("currentUserEmail");
            const user = list.find((u) => u.email === currentEmail) || list[list.length - 1];
            if (user && user.name) {
                messageBox.innerHTML = `
                    <strong>Dear ${user.name}, login successful!</strong>
                    <div>Email: ${user.email || "N/A"}</div>
                    <div>Gender: ${user.gender || "N/A"}</div>
                    <div>Course: ${user.course || "N/A"}</div>
                `;
            } else {
                messageBox.className = "status error";
                messageBox.textContent = "No saved user found. Please register and login again.";
            }
        } catch (err) {
            messageBox.className = "status error";
            messageBox.textContent = "Could not read saved data. Please login again.";
        }
    </script>
</body>
</html>
